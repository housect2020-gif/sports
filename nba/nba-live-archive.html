<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Live Sheet — Day Archive</title>
<style>
  :root{
    --grid-line:#d0d3d8;
    --header-bg:#eef1f4;
    --header-fg:#3c4043;
    --cell-bg:#ffffff;
    --yellow:#fff3b0;
    --pink:#f8c9c9;
    --green:#c8e9d1;
    --accent:#1a5cff;
    --live-dot:#e0473a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:12px;
    background:#f4f5f7;
    font-family:"Segoe UI", Calibri, Arial, sans-serif;
    color:#202124;
  }
  .wrap{max-width:940px;margin:0 auto;}
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:14px;
  }
  h1{
    font-size:19px;
    font-weight:600;
    margin:0;
    letter-spacing:.2px;
  }
  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#5f6368;
    background:#fff;
    border:1px solid var(--grid-line);
    border-radius:20px;
    padding:6px 12px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#9aa0a6;
  }
  .dot.live{
    background:var(--live-dot);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(224,71,58,.5);}
    70%{box-shadow:0 0 0 6px rgba(224,71,58,0);}
    100%{box-shadow:0 0 0 0 rgba(224,71,58,0);}
  }
  .banner{
    font-size:12.5px;
    color:#8a5300;
    background:#fff7e0;
    border:1px solid #f0dca0;
    border-radius:6px;
    padding:8px 12px;
    margin-bottom:14px;
    display:none;
  }
  .sheet-scroll{
    overflow-x:auto;
    border:1px solid var(--grid-line);
    border-radius:6px;
    background:#fff;
  }
  table{
    border-collapse:collapse;
    width:100%;
    min-width:820px; /* narrow screens scroll sideways instead of squashing the headers */
    table-layout:fixed;
    font-size:11px;
  }
  .hist-panel table{ min-width:0; }
  .hdr-row td{
    background:#f7f8fa;
    font-weight:700;
    color:#3c4043;
    font-size:11px;
    white-space:nowrap;
    word-break:normal;
    overflow-wrap:normal;
    padding:3px 2px;
  }
  th,td{
    border:1px solid var(--grid-line);
    padding:1px 2px;
    line-height:1.15;
    text-align:center;
    white-space:normal;
    word-break:break-word;
    overflow-wrap:break-word;
  }
  .colhead th{
    background:var(--header-bg);
    color:#5f6368;
    font-weight:500;
    font-size:10px;
    height:18px;
    padding:2px;
  }
  .corner{background:var(--header-bg);}
  .rownum{
    background:var(--header-bg);
    color:#5f6368;
    font-weight:500;
    width:14px;
    white-space:nowrap;
    padding-left:2px;
    padding-right:2px;
  }
  .hdr-row th{
    background:#f7f8fa;
    font-weight:600;
    color:#3c4043;
    font-size:10.5px;
  }
  td.team{
    text-align:center;
    font-weight:700;
    background:#fafbfc;
    font-size:10.5px;
    line-height:1.2;
    padding-left:2px;
    padding-right:2px;
    white-space:nowrap;
  }
  td.label{
    text-align:center;
    font-size:10px;
    color:#5f6368;
    font-style:italic;
    background:#fafbfc;
  }
  td.fit-line{
    white-space:nowrap !important;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:9px;
    padding-left:1px;
    padding-right:1px;
  }
  td.formula, td.avg{white-space:nowrap;}
  td.formula{font-weight:600;}
  td.avg{background:var(--yellow);}
  td.pred-total{background:var(--pink) !important;font-weight:700;}
  td.grand-total{background:var(--green) !important;font-weight:700;}
  td.blank{background:#fbfbfc;}
  .cell-label{
    display:block;
    font-size:8px;
    font-weight:400;
    letter-spacing:0.03em;
    color:#9aa0a6;
    text-transform:uppercase;
    line-height:1.1;
  }
  td.k4-cell{
    font-size:9.5px;
    line-height:1.25;
  }
  .light-yellow{color:#d4b700 !important;}
  select.light-yellow{color:#d4b700;}
  td.proj-label.proj-right{ border-left:1px solid #d0d7e5; }
  td.proj-label .proj-title{ display:block; font-size:9px; font-weight:700; color:#5f6368; letter-spacing:.3px; text-transform:uppercase; margin-bottom:1px; }
  td.proj-label .proj-note{ display:block; margin-left:0; }
  td.proj-label{ text-align:left; padding:2px 6px; font-size:10.5px; line-height:1.3; color:#3c4043; background:#f6f8fc; border-top:1px dashed #d0d7e5; }
  td.proj-label b{ font-weight:700; }
  td.proj-label .proj-note{ color:#80868b; font-size:9px; margin-left:8px; }
  .hist-panel{ margin-top:14px; border:1px solid #d0d7e5; border-radius:6px; background:#fff; padding:8px 12px; font-size:12px; }
  .hist-panel summary{ cursor:pointer; font-weight:700; font-size:13px; }
  .hist-panel table{ border-collapse:collapse; width:auto; min-width:100%; table-layout:auto; margin-top:8px; }
  .hist-panel th, .hist-panel td{ border:1px solid #e3e7ef; padding:3px 6px; text-align:center; white-space:nowrap; }
  .hist-panel th{ background:#f1f4fa; white-space:normal; line-height:1.2; vertical-align:bottom; min-width:58px; font-weight:700; }
  .hist-panel .hist-actions{ margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hist-panel .hist-note{ color:#80868b; font-size:11px; }
  .season-badge{display:inline-block; margin-right:8px; padding:0 6px; border-radius:3px; background:#e8eaed; color:#5f6368; font-size:10px; font-weight:700; letter-spacing:.4px; vertical-align:middle;}
  td.matchup-label{
    text-align:center;
    font-weight:600;
    font-size:11px;
    background:#f0f3ff;
    color:#26324a;
  }
  tr.spacer-row td{
    background:#f4f5f7;
    border-left:none;
    border-right:none;
    height:4px;
    padding:0;
    line-height:1;
  }
  input[type=number]{
    width:100%;
    max-width:38px;
    border:1px solid #c7cad0;
    border-radius:3px;
    text-align:center !important;
    font-size:11px;
    padding:0 1px;
    font-family:inherit;
    -moz-appearance:textfield;
    -webkit-appearance:none;
    appearance:none;
    margin:0 auto;
    display:block;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  input[type=number]:disabled{
    border:none;
    background:transparent;
    color:#202124;
    font-weight:600;
    text-align:center !important;
    opacity:1;
    -webkit-text-fill-color:#202124;
  }
  select{
    border:1px solid #c7cad0;
    border-radius:3px;
    font-size:10.5px;
    padding:0 2px;
    font-family:inherit;
    width:100%;
    max-width:52px;
    margin:0 auto;
    display:block;
    text-align:center !important;
    text-align-last:center;
  }
  .k5-cell{
    vertical-align:middle;
  }
  .k5-inner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:3px;
  }
  .odds-5min{
    margin-top:1px;
    font-size:8px;
    font-weight:400;
    letter-spacing:0.03em;
    color:#9aa0a6;
    text-transform:uppercase;
    line-height:1.3;
    text-align:center;
  }
  .odds-5min .odds-5min-value{
    display:block;
    font-size:10px;
    font-weight:700;
    letter-spacing:0;
    text-transform:none;
    color:#3c4043;
  }
  .k5-manual{
    display:inline-block !important;
    width:44px !important;
    max-width:44px;
    flex:0 0 auto;
    margin:0 !important;
    border:1px solid #c7cad0;
    border-radius:3px;
    text-align:center;
    font-size:11px;
    padding:0 1px;
    font-family:inherit;
  }
  .k5-select{
    display:inline-block !important;
    width:18px !important;
    max-width:18px;
    flex:0 0 auto;
    margin:0 !important;
    border:1px solid #c7cad0;
    border-radius:3px;
    background:#f4f5f7;
    font-size:9px;
    padding:0 0 0 2px;
    font-family:inherit;
    text-indent:-9999px; /* pushes the closed box's own selected-value text fully off-screen */
    overflow:hidden;
  }
  .k5-select option{
    color:#202124; /* the popup list itself still needs to be readable */
    text-indent:0;
  }
  .k5-suffix{
    flex:0 0 auto;
    font-size:11px;
    font-weight:600;
    color:#3c4043;
  }
  .footer{
    margin-top:12px;
    font-size:11.5px;
    color:#9aa0a6;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px;
  }
  button.refresh{
    border:1px solid var(--grid-line);
    background:#fff;
    border-radius:6px;
    padding:6px 12px;
    font-size:12.5px;
    cursor:pointer;
    color:#3c4043;
  }
  button.refresh:hover{background:#f1f3f4;}
  #reportDate{
    font-weight:600;
    color:#3c4043;
  }

  @media print{
    /* Buttons, the debug fetch-attempt log, and the "click to refresh"
       hint don't belong in a static export — everything else (title,
       status badge, table, footer text incl. the date) stays exactly
       as shown on screen. */
    .no-print{ display:none !important; }
    body{ background:#fff; margin:0; }
    .sheet-scroll{ border:none; overflow:visible; }
    table{ min-width:0 !important; }
    table{ font-size:10px; }
    tr{ break-inside:avoid; page-break-inside:avoid; }
    thead, .colhead, .hdr-row{ break-after:avoid; }
    @page{ size:landscape; margin:12mm; }

    /* Chrome (and most browsers) strip background colors by default when
       printing/saving to PDF, even though everything else renders as
       shown — this is what was washing out the yellow Avg Q1-3 cells,
       pink T=42min cells, green Total cells, and header shading. This
       forces the browser to keep them, matching the on-screen colors
       exactly rather than an approximation. */
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
  }
  #archBody input:disabled, #archBody select:disabled{opacity:1;color:#202124;-webkit-text-fill-color:#202124;}
  #dayPick, #fillDays{width:auto !important;max-width:none !important;min-width:150px;display:inline-block !important;margin:0 !important;padding:4px 8px !important;font-size:14px !important;text-align:left !important;text-align-last:left !important;}
</style>
</head><body><div class="wrap">
  <div class="topbar"><h1>NBA Live Sheet — Day Archive</h1>
    <span style="display:inline-flex;gap:14px;flex-wrap:wrap;"><a href="nba-live.html" style="color:#1a5cff;text-decoration:none;font-size:13px;font-weight:600;">← Live sheet</a><a href="../history.html?league=NBA" style="color:#1a5cff;text-decoration:none;font-size:13px;font-weight:600;">History →</a></span>
  </div>
  <div class="no-print" style="margin:8px 0;font-size:13px;">
    <label for="dayPick" style="font-weight:600;">Day:</label>
    <select id="dayPick" style="padding:4px 8px;font-size:13px;"><option value="">Choose a day…</option></select>
    <span id="dayNote" style="margin-left:8px;color:#5f6368;">Loading saved days…</span>
  </div>
  <div class="sheet-scroll"><table>
<colgroup id="mainColgroup">
        <col style="width:1.5%"> <!-- rownum -->
        <col style="width:4.5%"> <!-- Team (3-letter code) -->
        <col style="width:5%">   <!-- Q1 -->
        <col style="width:5%">   <!-- Q2 -->
        <col style="width:5%">   <!-- Q3 -->
        <col style="width:6.5%">  <!-- Avg Q1-3 -->
        <col style="width:6.5%"> <!-- Q4=6 min -->
        <col style="width:6.5%"> <!-- T=42 min -->
        <col style="width:5%">   <!-- Q4 -->
        <col style="width:7%">   <!-- Total -->
        <col style="width:7%">   <!-- O/U -->
        <col style="width:17%"> <!-- Odds -->
        <col style="width:10.5%"> <!-- Diff. -->
        <col style="width:13%">  <!-- Suggested Pick -->
      </colgroup>
    <tr class="colhead"><th class="corner"></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th><th>G</th><th>H</th><th>I</th><th>J</th><th>K</th><th>L</th><th>M</th></tr>
    <tr class="hdr-row"><td class="rownum">1</td><td>Team</td><td>Q1</td><td>Q2</td><td>Q3</td><td>Avg Q1-3</td><td>Q4=6 min</td><td>T=42 min</td><td>Q4</td><td>Total</td><td>O/U</td><td>Odds</td><td>Diff.</td><td>Suggested Pick</td></tr>
    <tbody id="archBody"></tbody>
  </table></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../cloud.js"></script>
<script>
const $ = id => document.getElementById(id);

// ---- shared sheet-style rows for games you have no personal snapshot of (from the shared games table) ----
const ABBR3X = { NY:"NYK", GS:"GSW", NO:"NOP", SA:"SAS", UTAH:"UTA", WSH:"WAS" };
const a3x = a => ABBR3X[a] || a;
const Q6_PROXIES = [
  u => u,
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u)
];
function clockMin(s){ const p = String(s || "").split(":"); if(p.length !== 2) return null; const m = parseFloat(p[0]), x = parseFloat(p[1]); return (isNaN(m) || isNaN(x)) ? null : m + x / 60; }
// Score right when Q4 hit 6:00 left, from ESPN's play-by-play. Returns {away, home} (running totals) or null.
async function fetchQ6(gameId){
  const target = `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${gameId}`;
  for(const w of Q6_PROXIES){
    try{
      const r = await fetch(w(target), { cache: "no-store" });
      if(!r.ok) continue;
      const plays = (await r.json()).plays || [];
      let cand = null;
      for(const p of plays){
        if(!p.period || p.period.number !== 4) continue;
        const rem = clockMin(p.clock && p.clock.displayValue);
        if(rem !== null && rem >= 6 && p.awayScore !== undefined && p.homeScore !== undefined) cand = p;
      }
      if(cand && !isNaN(Number(cand.awayScore)) && !isNaN(Number(cand.homeScore))) return { away: Number(cand.awayScore), home: Number(cand.homeScore) };
      if(plays.length) return null;        // feed answered but has no usable point
    }catch(e){}
  }
  return undefined;                        // couldn't reach ESPN — try again next time
}
function entriesNoteHtml(rec, tot){
  const col = r => r === "Over" ? "#0a7d3f" : (r === "Under" ? "#c5221f" : "#202124");
  const f = v => v == null || v === "" ? "–" : Number(v).toFixed(1);
  const side = (k5, j5, l4) => {
    const r = k5 == null ? null : (tot > k5 ? "Over" : (tot < k5 ? "Under" : "Push"));
    const mark = (p) => p && r && r !== "Push" ? (p === r ? " ✓" : " ✗") : "";
    const lean = (l4 != null && k5 != null) ? (l4 > k5 ? "Over" : (l4 < k5 ? "Under" : null)) : null;
    return `K5 <b>${f(k5)}</b> · J5 <b style="color:${col(j5)}">${j5 || "–"}</b>${mark(j5)} · L4 <b>${f(l4)}</b>${lean ? ` (${lean}${mark(lean)})` : ""}`;
  };
  const kF = rec.k5Final != null ? rec.k5Final : rec.odds5min;
  return `<b>At 6:00</b> — ${side(rec.odds5min, rec.j5At6, rec.l4At6)} &nbsp;|&nbsp; <b>Final</b> — ${side(kF, rec.j5Final, rec.l4Final)} &nbsp;|&nbsp; total ${tot}`;
}
function sharedRowsHtml(g, q6){
  const aq = (g.away_q || []).map(Number), hq = (g.home_q || []).map(Number);
  const q = (arr, i) => arr[i] === undefined || isNaN(arr[i]) ? null : arr[i];
  const show = v => v === null || v === undefined ? "–" : v;
  const avg3 = arr => arr.length >= 3 ? Math.round((arr[0] + arr[1] + arr[2]) / 3 * 10) / 10 : null;
  const otN = Math.max(0, Math.max(aq.length, hq.length) - 4);
  const tot = g.final_away + g.final_home;
  const pre = g.pre_odds == null ? null : Number(g.pre_odds);
  const res = pre == null ? "–" : (tot > pre ? "Over" : (tot < pre ? "Under" : "Push"));
  const col = r => r === "Over" ? "#0a7d3f" : (r === "Under" ? "#c5221f" : "#202124");
  const sum3 = arr => (q(arr,0) === null || q(arr,1) === null || q(arr,2) === null) ? null : q(arr,0) + q(arr,1) + q(arr,2);
  const fOf = (arr, raw) => (q6 && raw != null && sum3(arr) !== null) ? raw - sum3(arr) : null;
  const fA = fOf(aq, q6 && q6.away), fH = fOf(hq, q6 && q6.home);
  const gOf = (arr, f) => (f === null || sum3(arr) === null) ? null : sum3(arr) + f;
  const gA = gOf(aq, fA), gH = gOf(hq, fH);
  const teamRow = (name, arr, f, gg, fin) => `<tr><td class="rownum"></td><td class="team">${name}</td>
    <td>${show(q(arr,0))}</td><td>${show(q(arr,1))}</td><td>${show(q(arr,2))}</td>
    <td class="formula avg">${show(avg3(arr))}</td><td class="formula">${show(f)}</td><td class="formula">${show(gg)}</td>
    <td>${show(q(arr,3))}</td><td class="formula">${fin}</td>
    <td class="blank"></td><td class="blank"></td><td class="blank"></td><td class="blank"></td></tr>`;
  const sumQ = i => (q(aq,i) === null || q(hq,i) === null) ? null : q(aq,i) + q(hq,i);
  const t = [0,1,2,3].map(sumQ);
  const fT = fA !== null && fH !== null ? fA + fH : null, gT = gA !== null && gH !== null ? gA + gH : null;
  return `<tr><td class="rownum"></td><td colspan="13" class="matchup-label">${a3x(g.away)} @ ${a3x(g.home)} — Final${otN ? ` (${otN > 1 ? otN + "OT" : "OT"})` : ""}</td></tr>`
    + teamRow(a3x(g.away), aq, fA, gA, g.final_away) + teamRow(a3x(g.home), hq, fH, gH, g.final_home)
    + `<tr><td class="rownum"></td><td class="team">Total</td>
    <td class="formula">${show(t[0])}</td><td class="formula">${show(t[1])}</td><td class="formula">${show(t[2])}</td>
    <td class="formula avg">${t[0] !== null && t[1] !== null && t[2] !== null ? Math.round((t[0]+t[1]+t[2]) / 3 * 10) / 10 : "–"}</td><td class="formula">${show(fT)}</td><td class="formula">${show(gT)}</td>
    <td class="formula">${show(t[3])}</td><td class="formula grand-total">${tot}</td>
    <td class="formula"><span class="cell-label">PRE-ODDS</span>${pre == null ? "–" : pre.toFixed(1)}</td>
    <td class="formula">–</td><td class="formula">–</td><td class="formula" style="font-weight:700;color:${col(res)}">${res}</td></tr>
`;
}

// ---- your K5 / J5 / L4 entries under each game, with an Edit button ----
let HIST = {}, EDITS = {}, ENTRY_CTX = {};
const EDIT_FIELDS = ["odds5min", "j5At6", "l4At6", "k5Final", "j5Final", "l4Final"];
function recFor(gid, fallback){
  const rec = Object.assign({}, HIST[gid] || {}, EDITS[gid] || {});
  if(fallback){
    if(rec.k5Final == null && rec.odds5min == null && fallback.k5 != null) rec.k5Final = fallback.k5;
    if(!rec.j5Final && !rec.j5At6 && fallback.j5) rec.j5Final = fallback.j5;
  }
  return rec;
}
function noteRowHtml(gid, rec, tot, extra){
  const has = EDIT_FIELDS.some(f => rec[f] != null && rec[f] !== "");
  const text = has ? entriesNoteHtml(rec, tot) : "No K5 / J5 / L4 saved for this game.";
  return `<tr class="entry-row" data-gid="${gid}"><td class="rownum"></td><td colspan="13" class="proj-label" style="color:#202124">${text}${extra ? ` <span style="color:#5f6368">${extra}</span>` : ""} <button type="button" class="edit-entries no-print" data-gid="${gid}" style="margin-left:8px;font-size:11px;padding:1px 8px;cursor:pointer;">Edit</button></td></tr>`;
}
function entryFormHtml(gid){
  const rec = recFor(gid, ENTRY_CTX[gid] && ENTRY_CTX[gid].fallback);
  const inp = (f, label) => `<label style="margin-right:10px;white-space:nowrap">${label} <input data-f="${f}" type="number" step="0.5" value="${rec[f] == null ? "" : rec[f]}" style="width:70px;font-size:12px;padding:1px 3px;"></label>`;
  const sel = (f, label) => `<label style="margin-right:10px;white-space:nowrap">${label} <select data-f="${f}" style="width:auto;max-width:none;display:inline-block;font-size:12px;padding:1px 3px;text-align:left;"><option value=""></option><option${rec[f] === "Over" ? " selected" : ""}>Over</option><option${rec[f] === "Under" ? " selected" : ""}>Under</option></select></label>`;
  return `<b>Edit entries</b><br>At 6:00: ${inp("odds5min", "K5")}${sel("j5At6", "J5")}${inp("l4At6", "L4")}<br>Final: ${inp("k5Final", "K5")}${sel("j5Final", "J5")}${inp("l4Final", "L4")}
    <button type="button" class="save-entries" data-gid="${gid}" style="margin-left:6px;font-size:12px;padding:2px 10px;cursor:pointer;">Save</button>
    <button type="button" class="cancel-entries" data-gid="${gid}" style="font-size:12px;padding:2px 10px;cursor:pointer;">Cancel</button> <span class="entry-msg" style="color:#5f6368"></span>`;
}
function redrawNote(gid){
  const row = document.querySelector(`tr.entry-row[data-gid="${gid}"]`), ctx = ENTRY_CTX[gid];
  if(!row || !ctx) return;
  const tmp = document.createElement("tbody");
  tmp.innerHTML = noteRowHtml(gid, recFor(gid, ctx.fallback), ctx.tot, ctx.extra);
  row.replaceWith(tmp.firstElementChild);
}
document.addEventListener("click", async e => {
  const t = e.target;
  if(!t.closest) return;
  const eb = t.closest(".edit-entries"), sb_ = t.closest(".save-entries"), cb = t.closest(".cancel-entries");
  if(eb){
    const gid = eb.dataset.gid, td = eb.closest("td");
    if(td) td.innerHTML = entryFormHtml(gid);
  } else if(cb){
    redrawNote(cb.dataset.gid);
  } else if(sb_){
    const gid = sb_.dataset.gid, td = sb_.closest("td"), c = window.cloud;
    const obj = {};
    td.querySelectorAll("[data-f]").forEach(el => {
      const v = el.value.trim();
      obj[el.dataset.f] = v === "" ? null : (el.tagName === "SELECT" ? v : Number(v));
    });
    const msg = td.querySelector(".entry-msg");
    if(msg) msg.textContent = "Saving…";
    const val = JSON.stringify(obj);
    const r = await c.sb.from("user_data").upsert([{ user_id: c.user.id, key: `nba_edit_${gid}`, value: { v: val }, updated_at: new Date().toISOString() }], { onConflict: "user_id,key" });
    if(r.error){ if(msg) msg.textContent = "Save failed: " + (r.error.message || r.error); return; }
    EDITS[gid] = obj;
    try{ localStorage.setItem(`nba_edit_${gid}`, val); }catch(err){}
    redrawNote(gid);
  }
});
function predRowHtml(gid, rec){
  const k = rec.k5Final != null ? rec.k5Final : rec.odds5min;
  const kv = k == null ? "" : Math.floor(k);
  const j = rec.j5Final || "";
  const opt = (v, t) => `<option value="${v}"${j === v ? " selected" : ""}>${t}</option>`;
  return `<tr data-gid="${gid}"><td class="rownum"></td><td class="team" title="Predicted">Pred.</td>${'<td class="blank"></td>'.repeat(8)}
    <td><select class="arch-j5">${opt("", "–")}${opt("Under", "Under")}${opt("Over", "Over")}</select></td>
    <td class="k5-cell"><div class="k5-inner"><input type="text" inputmode="numeric" class="k5-manual arch-k5" placeholder="Total" value="${kv}"><span class="k5-suffix">.5</span></div></td>
    <td class="blank"></td><td class="blank"></td></tr>`;
}
function enableArchiveCells(root){
  root.querySelectorAll('[data-sid$="-K5manual"]').forEach(el => { el.disabled = false; el.classList.add("arch-k5"); });
  root.querySelectorAll('[data-sid$="-J5"]').forEach(el => { el.disabled = false; el.classList.add("arch-j5"); });
  // show your corrected values in the sheet cells
  root.querySelectorAll("tr[data-gid]").forEach(tr => {
    const gid = tr.dataset.gid, rec = recFor(gid);
    const k = tr.querySelector(".arch-k5"), j = tr.querySelector(".arch-j5");
    if(k && EDITS[gid] && EDITS[gid].k5Final != null) k.value = Math.floor(EDITS[gid].k5Final);
    if(j && EDITS[gid] && EDITS[gid].j5Final != null) j.value = EDITS[gid].j5Final;
  });
}
document.addEventListener("change", async e => {
  const el = e.target;
  if(!el.classList || !(el.classList.contains("arch-k5") || el.classList.contains("arch-j5"))) return;
  const tr = el.closest("tr[data-gid]"), c = window.cloud;
  if(!tr || !c) return;
  const gid = tr.dataset.gid;
  const obj = Object.assign({}, EDITS[gid] || {});
  if(el.classList.contains("arch-k5")){
    const v = el.value.trim();
    obj.k5Final = v === "" || isNaN(Number(v)) ? null : Number(v) + 0.5;
  } else {
    obj.j5Final = el.value || null;
  }
  const val = JSON.stringify(obj);
  EDITS[gid] = obj;          // update first, so two quick edits don't overwrite each other
  const r = await c.sb.from("user_data").upsert([{ user_id: c.user.id, key: `nba_edit_${gid}`, value: { v: val }, updated_at: new Date().toISOString() }], { onConflict: "user_id,key" });
  if(r.error){ alert("Save failed: " + (r.error.message || r.error)); return; }
  try{ localStorage.setItem(`nba_edit_${gid}`, val); }catch(err){}
  redrawNote(gid);
});
async function loadDayList(){
  const c = window.cloud;
  try{ await c.whenApproved(); }catch(e){ return []; }
  if(c.state !== "approved" || !c.sb) return [];
  const mine = await c.sb.from("user_data").select("key").like("key", "nba_snap_%");
  const days = new Set((mine.data || []).map(x => x.key.slice(9, 19)));
  const shared = await c.sb.from("games").select("game_date").eq("league", "NBA").eq("state", "post").neq("season_type", 1)
    .order("game_date", { ascending: false }).limit(600);
  (shared.data || []).forEach(x => x.game_date && days.add(x.game_date));
  return Array.from(days).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort().reverse();
}
// Loads a day and draws it; fills in the 6-minute scores afterwards (cached per game in your account).
async function showDayCommon(day, apply, stillCurrent){
  const c = window.cloud;
  const [mine, shared, edits, histRow] = await Promise.all([
    c.sb.from("user_data").select("value").like("key", `nba_snap_${day}_%`),
    c.sb.from("games").select("game_id,game_date,start_time,away,home,pre_odds,final_away,final_home,away_q,home_q,season_type")
      .eq("league", "NBA").eq("state", "post").eq("game_date", day).neq("season_type", 1),
    c.sb.from("user_data").select("key,value").like("key", "nba_edit_%"),
    c.sb.from("user_data").select("value").eq("key", "nba_history_v1")
  ]);
  if(mine.error || shared.error) return apply(null);
  try{ HIST = JSON.parse((histRow.data && histRow.data[0] && histRow.data[0].value && histRow.data[0].value.v) || "{}") || {}; }catch(e){ HIST = {}; }
  EDITS = {};
  (edits.data || []).forEach(x => { try{ EDITS[x.key.slice(9)] = JSON.parse(x.value && x.value.v); }catch(e){} });
  const own = (mine.data || []).map(x => x.value && x.value.snap).filter(s => s && s.kind !== "summary");
  const have = new Set(own.map(s => String(s.gid)));
  const totals = {};
  (shared.data || []).forEach(g => { if(g.final_away != null && g.final_home != null) totals["g" + g.game_id] = g.final_away + g.final_home; });
  const games = (shared.data || []).filter(g => !have.has("g" + g.game_id) && g.final_away != null && g.final_home != null);
  const keys = [];
  games.forEach(g => { ["K5manual", "K5", "J5", "oddsAt5min"].forEach(f => keys.push(`nba_${f}_g${g.game_id}`)); keys.push(`nba_snap_q6_g${g.game_id}`); });
  const extra = {};
  if(keys.length){
    const r = await c.sb.from("user_data").select("key,value").in("key", keys);
    (r.data || []).forEach(x => { extra[x.key] = x.value; });
  }
  const val = k => { const v = extra[k]; return v && v.v !== undefined ? v.v : null; };
  const q6 = {};
  games.forEach(g => { const v = extra[`nba_snap_q6_g${g.game_id}`]; if(v && v.q6) q6[g.game_id] = v.q6; });
  const minesOf = g => {
    const id = "g" + g.game_id, m = val(`nba_oddsAt5min_${id}`), k = val(`nba_K5_${id}`), km = val(`nba_K5manual_${id}`);
    let k5 = m !== null && m !== "" ? Number(m) : (k !== null && k !== "" ? Number(k) + 0.5 : (km !== null && km !== "" && Number(km) >= 100 ? Number(km) + 0.5 : null));
    const j5 = val(`nba_J5_${id}`);
    return { k5: isNaN(k5) ? null : k5, j5: j5 || null };
  };
  const stripNote = html => html.replace(/<tr><td class="rownum"><\/td><td colspan="13" class="proj-label" style="color:#202124">At 6:00.*?<\/tr>$/s, "");
  const draw = () => {
    const items = own.map(s => {
      const gid = String(s.gid), tot = totals[gid] != null ? totals[gid] : null;
      ENTRY_CTX[gid] = { tot, fallback: null, extra: "" };
      return { start: s.start || "", html: stripNote(s.html) + noteRowHtml(gid, recFor(gid), tot, "") };
    }).concat(games.map(g => {
      const gid = "g" + g.game_id, tot = g.final_away + g.final_home, fb = minesOf(g);
      const ex = q6[g.game_id] ? "" : "(6-minute score not available)";
      ENTRY_CTX[gid] = { tot, fallback: fb, extra: ex };
      return { start: g.start_time || "", html: sharedRowsHtml(g, q6[g.game_id] || null) + predRowHtml(gid, recFor(gid, fb)) + noteRowHtml(gid, recFor(gid, fb), tot, ex) + '<tr class="spacer-row"><td colspan="14"></td></tr>' };
    }));
    items.sort((a, b) => a.start.localeCompare(b.start));
    apply({ html: items.map(i => i.html).join(""), n: items.length, full: own.length, lookingUp: false });
    const ab = document.getElementById("archBody"); if(ab) enableArchiveCells(ab);
  };
  draw();
  const todo = games.filter(g => !q6[g.game_id]);
  if(!todo.length) return;
  apply({ progress: `Looking up 6-minute scores for ${todo.length} game${todo.length === 1 ? "" : "s"}…` });
  const save = [];
  for(let i = 0; i < todo.length; i += 3){
    await Promise.all(todo.slice(i, i + 3).map(async g => {
      const r = await fetchQ6(g.game_id);
      if(r){ q6[g.game_id] = r; save.push({ user_id: c.user.id, key: `nba_snap_q6_g${g.game_id}`, value: { q6: r }, updated_at: new Date().toISOString() }); }
    }));
    if(!stillCurrent()) break;
    draw();
  }
  if(save.length) c.sb.from("user_data").upsert(save, { onConflict: "user_id,key" });
  if(stillCurrent()) draw();
}

async function loadDays(){
  const days = await loadDayList();
  $("dayPick").innerHTML = days.length ? days.map(d => `<option value="${d}">${d}</option>`).join("") : `<option value="">No days yet</option>`;
  $("dayNote").textContent = days.length ? "" : "Days appear here as games finish.";
  if(days.length) showDay();
}
async function showDay(){
  const day = $("dayPick").value;
  if(!day){ $("archBody").innerHTML = ""; return; }
  $("dayNote").textContent = "Loading…";
  await showDayCommon(day, r => {
    if($("dayPick").value !== day) return;
    if(r === null){ $("dayNote").textContent = "Couldn't load that day."; return; }
    if(r.progress){ $("dayNote").textContent = r.progress; return; }
    $("archBody").innerHTML = r.html;
    $("dayNote").textContent = `${r.n} game${r.n === 1 ? "" : "s"} on ${day} (${r.full} saved with your entries, the rest from the shared scores).`;
  }, () => $("dayPick").value === day);
}
$("dayPick").addEventListener("change", showDay);
loadDays();
</script></body></html>
